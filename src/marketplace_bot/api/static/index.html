<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Navigator Companion</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="bootstrap-shell">
      <section class="bootstrap-card">
        <p class="eyebrow">Controller Active</p>
        <h1>Live Navigator Companion</h1>
        <p id="bootstrap-message" class="bootstrap-copy">
          Connecting the overlay to your controlled Chrome tab. If the overlay does not appear, click retry.
        </p>
        <div class="bootstrap-actions">
          <button id="retry-bootstrap-btn" class="btn btn-primary" type="button">Retry Overlay</button>
        </div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
